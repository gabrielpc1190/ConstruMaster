{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold">Marcar pago como realizado</h1>
<p>Pago: <strong>{{ pago.monto }}</strong></p>
<p>OC: <a href="{% url 'compras:oc_detail' pk=pago.oc.pk %}" class="text-blue-600">{{ pago.oc.numero_oc }}</a></p>
<p>Programado para: {{ pago.fecha_programada }}</p>

<form method="post" enctype="multipart/form-data" class="space-y-3 bg-white p-4 rounded shadow mt-4 max-w-lg">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn-primary">Marcar como pagado</button>
  <a href="{% url 'compras:oc_detail' pk=pago.oc.pk %}" class="btn-secondary ml-2">Cancelar</a>
</form>
{% endblock %}
