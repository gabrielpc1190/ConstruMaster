{% extends "base.html" %}
{% load money_extras %}
{% block content %}
<h1 class="text-2xl font-bold">Programar pago para {{ oc.numero_oc }}</h1>
<p>OC total: {{ oc.monto_total }}</p>
<p>Proveedor: {{ oc.proveedor.nombre }}</p>

<form method="post" class="space-y-3 bg-white p-4 rounded shadow mt-4 max-w-lg">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn-primary">Programar</button>
  <a href="{% url 'compras:oc_detail' pk=oc.pk %}" class="btn-secondary ml-2">Cancelar</a>
</form>
{% endblock %}
