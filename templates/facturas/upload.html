{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold">Subir factura para {{ oc.numero_oc }}</h1>
<form method="post" enctype="multipart/form-data"
      class="space-y-3 bg-white p-4 rounded shadow mt-4 max-w-lg">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn-primary">Subir</button>
  <a href="{% url 'compras:oc_detail' pk=oc.pk %}" class="btn-secondary ml-2">Cancelar</a>
</form>
{% endblock %}
