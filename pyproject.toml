[project]
name = "construmaster"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-q2>=1.10",
    "django-htmx>=1.27",
    "django-tailwind-cli>=4.6",
    "django-money>=3.6",
    "django-auditlog>=3.0",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "httpx>=0.27",
    "lxml>=5.3",
    "google-genai>=1.0",
    "Pillow>=11.0",
    "pyheif>=0.8",
    "babel>=2.16",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.7",
    "ipython>=8.30",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "construmaster.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db -p no:cacheprovider"
