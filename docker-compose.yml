services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    command: docker/web.entrypoint.sh
    env_file: .env
    volumes:
      # Bind mounts del código fuente para que cambios en host se vean
      # inmediatamente y migraciones generadas dentro del container persistan
      # al host. En producción se respeta el mismo pattern (el código vive
      # en el host vía git pull).
      - ./apps:/app/apps
      - ./construmaster:/app/construmaster
      - ./manage.py:/app/manage.py
      - ./src:/app/src
      - ./templates:/app/templates
      - ./docker:/app/docker
      - mediadata:/var/data/files
      - staticdata:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # NO ports: — accesible solo via red interna y cloudflared

  worker:
    build: .
    command: docker/worker.entrypoint.sh
    env_file: .env
    volumes:
      - ./apps:/app/apps
      - ./construmaster:/app/construmaster
      - ./manage.py:/app/manage.py
      - ./docker:/app/docker
      - mediadata:/var/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    depends_on:
      - web
    profiles: ["production"]   # solo se levanta con `--profile production`

volumes:
  pgdata:
  redisdata:
  mediadata:
  staticdata:
